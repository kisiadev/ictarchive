<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>ICT융합보안크루 아카이브</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', sans-serif; }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .text-gold {
      color: #fbbf24;
      text-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between relative">

  <!-- GNB 헤더 (토글 스위치 적용) -->
  <div class="bg-white border-b border-slate-200 py-3 px-4 sm:px-6 shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      
      <!-- 로고 영역 -->
      <div class="flex items-center gap-2 sm:gap-4 md:gap-6">
        <a href="https://www.kisia.or.kr/ks/kisia_index.php" target="_blank" rel="noopener noreferrer" class="shrink-0 transition-transform hover:scale-105" title="한국정보보호산업협회 바로가기">
          <img src="logo-kisia.png" alt="한국정보보호산업협회" class="h-5 sm:h-6 md:h-8 object-contain" />
        </a>
             </div>
    </div>
  </div>

  <!-- Hero Banner -->
  <header id="top-header" class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white py-10 sm:py-12 px-4 sm:px-6 shadow-md">
    <div class="max-w-6xl mx-auto">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-[10px] sm:text-xs font-semibold mb-3 border border-blue-400/30">
        <i class="fa-solid fa-user-shield"></i> ICT Convergence Security Crew
      </div>
      
      <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-extrabold tracking-tight break-keep">
        ICT융합보안크루 아카이브
      </h1>
      <p class="mt-2 text-slate-300 text-xs sm:text-sm md:text-base break-keep">
        ICT융합보안크루의 여정을 한곳에서 확인해보세요.
      </p>
    </div>
  </header>

  <!-- Main Content Area (2단 구조: 왼쪽 본문, 오른쪽 세로형 기수 선택 사이드바) -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10 flex-grow w-full">
   
        </section>

        <!-- ICT융합보안크루 연구 활동 성과관 (Projects) -->
        <section id="project-section" class="space-y-6 pt-4">
          <div class="border-b border-slate-200 pb-4">
            <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
              <span class="text-blue-600"><i class="fa-solid fa-laptop-code"></i></span> ICT융합보안크루 연구 활동 성과관
            </h2>
            <p class="text-sm text-slate-500 mt-1">팀별 심층 프로젝트 결과물, 요약문 및 최종 산출물 아카이브</p>
          </div>

          <div id="crew-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-10 text-center text-slate-400 text-sm">
              <i class="fa-solid fa-spinner fa-spin mr-2"></i> 프로젝트 데이터를 불러오는 중입니다...
            </div>
          </div>
        </section>

      </div>

      <!-- 오른쪽: 세로형 기수 선택 사이드 네비게이션 -->
      <aside class="lg:col-span-3 lg:sticky lg:top-24 space-y-3">
        <div class="border-l-2 border-slate-300 pl-4 space-y-2" id="crew-gen-filters">
          <!-- 동적 생성되는 기수 목록 -->
        </div>
      </aside>

    </div>
  </main>


  <!-- 모달 1: 프로젝트 상세 보기 모달 -->
  <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 sm:p-8 shadow-2xl relative animate-in fade-in zoom-in duration-200">
      <button onclick="closeModal('detail-modal')" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 text-lg w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-100 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- 모달 2: 타임라인 활동 갤러리 모달 -->
  <div id="gallery-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-hidden shadow-2xl flex flex-col relative animate-in fade-in zoom-in duration-200">
      <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <div>
          <span id="gallery-badge" class="px-2 py-0.5 rounded text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200"></span>
          <h3 id="gallery-title" class="text-base sm:text-lg font-bold text-slate-900 mt-1"></h3>
        </div>
        <button onclick="closeModal('gallery-modal')" class="text-slate-400 hover:text-slate-600 text-lg w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-200 transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="gallery-body" class="p-6 overflow-y-auto space-y-6 flex-grow"></div>
    </div>
  </div>

  <!-- 모달 3: 원본 사진 단독 확대 뷰어 (Lightbox) -->
  <div id="lightbox-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4" onclick="closeModal('lightbox-modal')">
    <button onclick="closeModal('lightbox-modal')" class="absolute top-5 right-5 text-white/70 hover:text-white text-2xl w-10 h-10 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 transition">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="max-w-5xl max-h-[85vh] flex flex-col items-center justify-center p-2" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="원본 사진" class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl" />
      <p id="lightbox-caption" class="text-white/80 text-xs sm:text-sm mt-3 text-center px-4"></p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-200 bg-white py-8 px-6 text-xs text-slate-500 mt-16">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4 opacity-75">
        <img src="logo-kisia.png" alt="한국정보보호산업협회" class="h-6 object-contain grayscale" />
        <img src="logo-ict.png" alt="ICT 융합 산업보안 인력양성사업" class="h-5 object-contain grayscale" />
      </div>
      <p class="text-center md:text-right">© 2026 KISIA 한국정보보호산업협회. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- ========================================== -->
  <!-- ⚙️ 스크립트 로직 -->
  <!-- ========================================== -->
  <script>
    const CREW_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSX8ZG1BwtKpvS72k4ut88Nf2gdn9PP78EFKjedj9_s56NuOeYLpsxcmG8L4pTPWjGIuNy0xpTCnsBt/pub?gid=0&single=true&output=csv";
    const ACTIVITY_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSX8ZG1BwtKpvS72k4ut88Nf2gdn9PP78EFKjedj9_s56NuOeYLpsxcmG8L4pTPWjGIuNy0xpTCnsBt/pub?gid=1121022433&single=true&output=csv";
    const STATS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSX8ZG1BwtKpvS72k4ut88Nf2gdn9PP78EFKjedj9_s56NuOeYLpsxcmG8L4pTPWjGIuNy0xpTCnsBt/pub?gid=2090450298&single=true&output=csv";

    let crewData = [];
    let activityData = [];
    let statsData = [];
    let currentGenFilter = 'ALL';

    function formatDriveImageUrl(url) {
      if (!url) return '';
      const cleanUrl = url.trim();
      const match = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1200`;
      }
      return cleanUrl;
    }

    function fetchSheetData(url) {
      return new Promise((resolve, reject) => {
        Papa.parse(url, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: results => resolve(results.data),
          error: err => reject(err)
        });
      });
    }

    async function initPage() {
      try {
        const [crewRes, actRes, statsRes] = await Promise.all([
          fetchSheetData(CREW_CSV_URL),
          fetchSheetData(ACTIVITY_CSV_URL),
          fetchSheetData(STATS_CSV_URL)
        ]);

        crewData = crewRes;
        activityData = actRes;
        statsData = statsRes;

        setupGenFilters();
        renderStats();
        renderTimeline();
        renderCrewCards();
      } catch (error) {
        console.error("데이터 로드 실패:", error);
      }
    }

    // 오른쪽 세로 사이드바 기수별 버튼 렌더링
    function setupGenFilters() {
      const container = document.getElementById('crew-gen-filters');
      const allGens = [...new Set([
        ...crewData.map(d => d.gen),
        ...activityData.map(d => d.gen),
        ...statsData.map(d => d.gen)
      ].filter(Boolean))].sort().reverse();

      let html = `<button onclick="filterCrew('ALL')" class="crew-filter-btn block w-full text-left py-1.5 px-2 rounded-lg text-sm font-semibold transition-all duration-300 ${currentGenFilter === 'ALL' ? 'text-slate-900 font-bold bg-slate-200/60 translate-x-1 shadow-sm' : 'text-slate-400 hover:text-slate-600 opacity-60 hover:opacity-100'}">전체 보기</button>`;
      
      allGens.forEach(gen => {
        html += `<button onclick="filterCrew('${gen}')" class="crew-filter-btn block w-full text-left py-1.5 px-2 rounded-lg text-sm font-semibold transition-all duration-300 ${gen === currentGenFilter ? 'text-slate-900 font-bold bg-slate-200/60 translate-x-1 shadow-sm' : 'text-slate-400 hover:text-slate-600 opacity-60 hover:opacity-100'}">${gen}</button>`;
      });
      container.innerHTML = html;
    }

    function filterCrew(gen) {
      currentGenFilter = gen;
      setupGenFilters();
      renderStats();
      renderTimeline();
      renderCrewCards();
    }


    // 1. 타임라인 렌더링
    function renderTimeline() {
      const container = document.getElementById('timeline-container');
      const filtered = currentGenFilter === 'ALL' ? activityData : activityData.filter(item => item.gen === currentGenFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="py-10 text-slate-400 text-xs">선택한 기수의 활동 타임라인 데이터가 없습니다.</div>`;
        return;
      }

      container.innerHTML = filtered.map((item) => {
        const originalIndex = activityData.indexOf(item);
        const images = (item.images || '').split(/[\n,]+/).map(s => formatDriveImageUrl(s)).filter(Boolean);
        const captions = (item.captions || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
        const firstImg = images[0] || '';

        const hasDetailedGallery = images.length > 1 || captions.length > 0;

        let badgeColor = "bg-indigo-50 text-indigo-700 border-indigo-200";
        if ((item.step || '').includes("모집")) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
        if ((item.step || '').includes("성과")) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";

        return `
          <div class="relative group">
            <div class="absolute -left-[31px] md:-left-[39px] top-1.5 w-4 h-4 rounded-full bg-white border-4 border-indigo-600 group-hover:scale-125 transition-transform shadow-sm"></div>

            <div class="bg-white rounded-2xl border border-slate-200 p-5 hover:shadow-md transition-shadow">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200">${item.gen || ''}</span>
                  <span class="px-2.5 py-0.5 rounded-md text-xs font-bold border ${badgeColor}">${item.step || ''}</span>
                </div>
                <span class="text-xs font-medium text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${item.date || ''}</span>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-center">
                <div class="${firstImg ? 'md:col-span-8' : 'md:col-span-12'}">
                  <h3 class="text-base sm:text-lg font-bold text-slate-900">${item.title || ''}</h3>
                  <p class="text-xs sm:text-sm text-slate-600 mt-2 leading-relaxed">${item.summary || ''}</p>
                  
                  ${hasDetailedGallery ? `
                    <div class="mt-4 flex items-center gap-3">
                      <button onclick="openGalleryModal(${originalIndex})" class="px-3.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold rounded-lg border border-indigo-200 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-images"></i> 현장 사진 & 설명 (${images.length}장)
                      </button>
                    </div>
                  ` : ''}
                </div>

                ${firstImg ? `
                  <div class="md:col-span-4 cursor-pointer overflow-hidden rounded-xl border border-slate-200 bg-slate-100/70 p-1 flex items-center justify-center group/img relative" 
                       onclick="${hasDetailedGallery ? `openGalleryModal(${originalIndex})` : `openLightbox('${firstImg}', '${encodeURIComponent(item.title || '')}')`}">
                    <div class="relative w-full h-44 sm:h-36 flex items-center justify-center">
                      <img src="${firstImg}" alt="${item.title || ''}" class="max-w-full max-h-full object-contain rounded-lg group-hover/img:scale-105 transition duration-300" onerror="this.src='https://placehold.co/600x400?text=Photo'" />
                      <div class="absolute inset-0 bg-slate-950/25 opacity-0 group-hover/img:opacity-100 rounded-lg flex items-center justify-center text-white transition">
                        <span class="text-xs bg-slate-900/80 px-2.5 py-1 rounded-full flex items-center gap-1">
                          <i class="fa-solid fa-expand text-[10px]"></i> ${hasDetailedGallery ? '갤러리 열기' : '원본 보기'}
                        </span>
                      </div>
                    </div>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 2. 프로젝트 카드 렌더링
    function renderCrewCards() {
      const grid = document.getElementById('crew-grid');
      const filtered = currentGenFilter === 'ALL' ? crewData : crewData.filter(item => item.gen === currentGenFilter);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-10 text-center text-slate-400 text-xs">등록된 연구 과제가 없습니다.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const isBest = String(item.isBest).toUpperCase() === 'TRUE';
        const originalIndex = crewData.indexOf(item);

        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col justify-between hover:shadow-md transition-shadow relative">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200">${item.gen || ''} · ${item.category || ''}</span>
                ${isBest ? '<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-50 text-amber-600 border border-amber-200"><i class="fa-solid fa-award mr-1"></i>우수작</span>' : ''}
              </div>
              <span class="text-xs font-semibold text-blue-600 tracking-wide uppercase">[${item.domain || '일반'}]</span>
              <h3 class="text-base font-bold text-slate-900 mt-1 leading-snug">${item.title || ''}</h3>
              <p class="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed">${item.description || ''}</p>
              ${item.team ? `<p class="text-[11px] text-slate-400 mt-2.5"><i class="fa-solid fa-users text-[10px] mr-1"></i>${item.team}</p>` : ''}
            </div>
            <div class="pt-4 mt-4 border-t border-slate-100 flex items-center justify-between text-xs">
              <span class="text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${item.date || ''}</span>
              <button onclick="openProjectModal(${originalIndex})" class="font-semibold text-blue-600 hover:text-blue-800 flex items-center gap-1.5 transition">
                <span>자세히 보기</span> <i class="fa-solid fa-circle-info text-[11px]"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openGalleryModal(index) {
      const item = activityData[index];
      if (!item) return;

      document.getElementById('gallery-badge').innerText = `${item.gen || ''} · ${item.step || ''}`;
      document.getElementById('gallery-title').innerText = item.title || '';

      const images = (item.images || '').split(/[\n,]+/).map(s => formatDriveImageUrl(s)).filter(Boolean);
      const captions = (item.captions || '').split(/\n+/).map(s => s.trim());

      const body = document.getElementById('gallery-body');
      body.innerHTML = `
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs text-slate-600 leading-relaxed mb-6">
          <span class="font-semibold text-slate-800">일시: ${item.date || '-'}</span><br />
          ${item.summary || ''}
        </div>
        <div class="space-y-8">
          ${images.map((img, i) => `
            <div class="space-y-2">
              <div class="rounded-xl overflow-hidden border border-slate-200 bg-slate-100 p-2 flex items-center justify-center cursor-pointer group/modalimg relative"
                   onclick="openLightbox('${img}', '${encodeURIComponent(captions[i] || item.title || '')}')">
                <img src="${img}" alt="활동 사진" class="w-full h-auto max-h-[500px] object-contain rounded-lg group-hover/modalimg:scale-[1.01] transition duration-200" onerror="this.src='https://placehold.co/800x500?text=Photo'" />
                <span class="absolute bottom-4 right-4 bg-slate-900/80 text-white text-[11px] px-2.5 py-1 rounded-full opacity-0 group-hover/modalimg:opacity-100 transition flex items-center gap-1">
                  <i class="fa-solid fa-expand text-[10px]"></i> 원본 확대
                </span>
              </div>
              <p class="text-xs sm:text-sm text-slate-600 px-1 leading-relaxed flex items-start gap-1.5">
                <i class="fa-solid fa-camera text-slate-400 text-xs mt-1"></i>
                <span>${captions[i] || `${item.title} 현장 스케치 (${i + 1})`}</span>
              </p>
            </div>
          `).join('')}
        </div>
      `;

      openModal('gallery-modal');
    }

    function openLightbox(imgUrl, encodedCaption) {
      const caption = decodeURIComponent(encodedCaption || '');
      document.getElementById('lightbox-img').src = imgUrl;
      document.getElementById('lightbox-caption').innerText = caption;
      openModal('lightbox-modal');
    }

    function openProjectModal(index) {
      const item = crewData[index];
      if (!item) return;

      const isBest = String(item.isBest).toUpperCase() === 'TRUE';
      const content = document.getElementById('modal-content');
      const detailDescription = item.modalDesc && item.modalDesc.trim() !== '' ? item.modalDesc : item.description;
      const customLinkLabel = item.linkLabel && item.linkLabel.trim() !== '' ? item.linkLabel : '산출물 바로가기';

      let finalLink = '';
      const rawLink = item.link ? item.link.trim() : '';
      const hasValidLink = rawLink !== '' && rawLink !== '#';
      
      if (hasValidLink) {
        if (rawLink.includes('drive.google.com')) {
          const fileIdMatch = rawLink.match(/[-\w]{25,}/); 
          if (fileIdMatch && fileIdMatch[0]) {
            finalLink = `https://drive.google.com/file/d/${fileIdMatch[0]}/view`;
          } else {
            finalLink = rawLink.startsWith('http') ? rawLink : 'https://' + rawLink;
          }
        } 
        else if (rawLink.startsWith('http') || rawLink.startsWith('/')) {
          finalLink = rawLink;
        } 
        else if (rawLink.includes('.com') || rawLink.includes('.kr') || rawLink.includes('.net') || rawLink.includes('.so')) {
          finalLink = 'https://' + rawLink;
        } 
        else {
          finalLink = rawLink;
        }
      }

      content.innerHTML = `
        <div class="flex items-center gap-2 mb-3">
          <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200">${item.gen || ''} · ${item.category || ''}</span>
          ${isBest ? '<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-50 text-amber-600 border border-amber-200"><i class="fa-solid fa-award mr-1"></i>우수작</span>' : ''}
        </div>
        <span class="text-xs font-semibold text-blue-600 tracking-wide uppercase">[${item.domain || '일반'}]</span>
        <h3 class="text-xl font-extrabold text-slate-900 mt-1 leading-snug">${item.title || ''}</h3>
        
        <div class="my-4 p-3.5 bg-slate-50 rounded-xl text-xs space-y-1.5 text-slate-600 border border-slate-100">
          <div><span class="text-slate-400 font-medium w-16 inline-block">활동 일자:</span> ${item.date || '-'}</div>
          ${item.team ? `<div><span class="text-slate-400 font-medium w-16 inline-block">참여 대상:</span> ${item.team}</div>` : ''}
          ${item.modalMentor ? `<div><span class="text-slate-400 font-medium w-16 inline-block">지도/멘토:</span> <span class="font-semibold text-slate-700">${item.modalMentor}</span></div>` : ''}
          ${item.modalHighlight ? `<div><span class="text-slate-400 font-medium w-16 inline-block">주요 성과:</span> <span class="text-blue-700 font-semibold">${item.modalHighlight}</span></div>` : ''}
        </div>

        <div class="space-y-1.5 my-4">
          <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">연구 상세 내용</h4>
          <div class="text-sm text-slate-600 whitespace-pre-line leading-relaxed max-h-60 overflow-y-auto pr-2">
            ${detailDescription || '등록된 상세 설명이 없습니다.'}
          </div>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-end gap-2.5">
          <button onclick="closeModal('detail-modal')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition">닫기</button>
          
          ${hasValidLink ? `
            <a href="${finalLink}" target="_blank" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 shadow-sm transition">
              <span>${customLinkLabel}</span> <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          ` : ''}
        </div>
      `;

      openModal('detail-modal');
    }

    function openModal(modalId) {
      document.getElementById(modalId).classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
      const anyOpen = ['detail-modal', 'gallery-modal', 'lightbox-modal'].some(id => !document.getElementById(id).classList.contains('hidden'));
      if (!anyOpen) {
        document.body.style.overflow = '';
      }
    }

    window.addEventListener('click', (e) => {
      ['detail-modal', 'gallery-modal'].forEach(id => {
        const modal = document.getElementById(id);
        if (e.target === modal) closeModal(id);
      });
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal('lightbox-modal');
        closeModal('gallery-modal');
        closeModal('detail-modal');
      }
    });

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
